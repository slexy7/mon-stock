<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Stock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#244936">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Stock">

<link rel="apple-touch-icon" href="icon-192.png">
</head>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
    }
</script>
<body>

    <header>
        <h1>📦 Mon Stock</h1>
        <p>Gestion de ma marchandise</p>
    </header>

    <main>

        <section class="resume">
            <div>
                <span>Articles</span>
                <strong id="nombreArticles">0</strong>
            </div>

            <div>
                <span>Valeur du stock</span>
                <strong id="valeurStock">0,00 €</strong>
            </div>
        </section>

        <button class="bouton-ajouter" onclick="ouvrirFormulaire()">
            + Ajouter une marchandise
        </button>

        <section class="recherche">
            <input
                type="text"
                id="recherche"
                placeholder="🔎 Rechercher une marchandise..."
                oninput="afficherStock()"
            >
        </section>

        <section id="stock">
            <p class="vide">Aucune marchandise enregistrée.</p>
        </section>

    </main>

    <!-- Fenêtre pour ajouter un article -->
    <div id="formulaire" class="fenetre">
        <div class="contenu-fenetre">

            <button class="fermer" onclick="fermerFormulaire()">×</button>

            <h2>Ajouter une marchandise</h2>

            <label>Nom</label>
            <input type="text" id="nom" placeholder="Ex : Roses rouges">

            <label>Catégorie</label>
            <input type="text" id="categorie" placeholder="Ex : Fleurs">

            <label>Quantité</label>
            <input type="number" id="quantite" min="0" placeholder="Ex : 25">

            <label>Prix d'achat (€)</label>
            <input type="number" id="prix" min="0" step="0.01" placeholder="Ex : 2.50">

            <label>Seuil d'alerte</label>
            <input type="number" id="seuil" min="0" placeholder="Ex : 5">

            <button class="bouton-enregistrer" onclick="ajouterArticle()">
                Enregistrer
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
